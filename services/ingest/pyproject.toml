[project]
name = "radar-ingest"
version = "0.1.0"
description = "Fetches public job boards (Greenhouse, Lever, Ashby) into PostgreSQL"
readme = "README.md"
authors = [
    { name = "Sergii Prostov", email = "spro77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
