name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a deploy on main halfway; only superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # The Function App's default domain (Azure → Overview); hardcoded until it changes.
          VITE_API_URL: https://func-job-market-radar-dffahbghfxbrcgf0.westus2-01.azurewebsites.net/api

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

      # The Functions package: dist, host.json, package.json and production dependencies.
      # Functions does not follow pnpm's symlinks, so node_modules is hoisted (real folders);
      # "files" in apps/api/package.json keeps local.settings.json out.
      - name: Package API
        if: github.event_name == 'push'
        run: pnpm --config.node-linker=hoisted --filter @radar/api deploy --prod api-package

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: api-package
          path: api-package
          if-no-files-found: error

  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # A Neon dev branch for tests/test_aggregate_run.py; they are skipped when it is empty.
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true

  deploy-api:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-package
          path: api-package

      # Publish profile auth on Flex Consumption needs sku and SCM basic auth enabled on the app.
      # The package is built already, so no remote build.
      - uses: Azure/functions-action@v1
        with:
          app-name: func-job-market-radar
          package: api-package
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption
